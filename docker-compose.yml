services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-nimbo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Mentors and the programme lead. A per-person value beats the shared one.
      MENTOR_PASSWORD: ${MENTOR_PASSWORD:-}
      LEAD_PASSWORD: ${LEAD_PASSWORD:-}
      STAFF_PASSWORD_SALEH: ${STAFF_PASSWORD_SALEH:-}
      STAFF_PASSWORD_ASGARIAN: ${STAFF_PASSWORD_ASGARIAN:-}
      STAFF_PASSWORD_TARKASHVAND: ${STAFF_PASSWORD_TARKASHVAND:-}
      STAFF_PASSWORD_AMIR: ${STAFF_PASSWORD_AMIR:-}
      STAFF_PASSWORD_LEAD: ${STAFF_PASSWORD_LEAD:-}
      # TPMها. عمداً روی MENTOR_PASSWORD نمی‌افتند — دو فانل جدا نباید یک رمز مشترک داشته
      # باشند، وگرنه هر منتوری می‌تواند به‌عنوان TPM وارد شود.
      TPM_PASSWORD: ${TPM_PASSWORD:-}
      # اعلام مناسبت‌ها در گروه بله. بدون این دو، بات خاموش است و چیزی عوض نمی‌شود.
      # توکن فقط در .env روی سرور می‌نشیند — این ریپو عمومی است.
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_CHAT_ID: ${BALE_CHAT_ID:-}
      ANNOUNCE_DRY_RUN: ${ANNOUNCE_DRY_RUN:-}
    volumes:
      # The roadmap state lives here. Back this up and you have backed up everything.
      - roadmap-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  roadmap-data:
